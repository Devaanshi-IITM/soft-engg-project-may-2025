services:

  fastapi:
    build: ./backend
    container_name: fastapi-app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - mongo
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: fastapi_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
    networks:
      - backend

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: fastapi_db
    networks:
      - backend

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    networks:
      - backend

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    networks:
      - backend

networks:
  backend:
